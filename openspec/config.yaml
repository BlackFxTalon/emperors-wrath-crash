schema: spec-driven

context: |
  Project: "Emperor's Wrath" — iGaming crash game (demo, client-side), Warhammer 40K grimdark style.
  Tech stack: Vite + TypeScript (strict), Pixi.js v8 (2D HUD/UI layer, particles, trail),
  Three.js (3D scene: starfield, warp flight, torpedo, post-bloom), stacked canvases
  (Three.js below, Pixi.js transparent above). No server — provably-fair crash point generated
  via SHA-256 hash chain (seed + nonce) purely client-side for demo purposes.
  Assets: assets/exec-24e53c03-*.png = gothic hive city background (burning sky),
  assets/exec-544be0c1-*.png = gothic torpedo with red warp flame (transparent bg).
  Style: gothic serif fonts (Cinzel/IM Fell), palette: blood red #8a0303, bone gold #c9a227,
  void black #0a0908, purity white. Game terms WH40K-flavored: multiplier = "Warp Charge",
  cash out = "Extraction", crash = "Warp Rift". Audience: desktop web, responsive to mobile.
  Language: all user-facing text in English (grimdark tone), specs in English.

rules:
  proposal:
    - Keep proposals concise; include Non-goals.
  tasks:
    - Group tasks by checkbox sections (setup, rendering, game logic, UI, polish).
  specs:
    - Every requirement must have at least one #### Scenario: with WHEN/THEN.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
